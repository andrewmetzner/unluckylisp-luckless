<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rune Pull</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1612;
      color: #d4c9a8;
      font-family: Georgia, 'Times New Roman', serif;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2rem;
      letter-spacing: 0.15em;
      color: #e8d5a0;
      margin-bottom: 0.4rem;
    }

    header p {
      font-size: 0.85rem;
      color: #7a6f5a;
      letter-spacing: 0.08em;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
    }

    .controls label {
      font-size: 0.9rem;
      color: #a89b7a;
      letter-spacing: 0.06em;
    }

    .controls select {
      background: #2a2318;
      border: 1px solid #4a4030;
      color: #d4c9a8;
      font-family: inherit;
      font-size: 1rem;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      outline: none;
    }

    .controls select:focus {
      border-color: #8a7a50;
    }

    .pull-btn {
      background: #3a2f1a;
      border: 1px solid #6a5a30;
      color: #e8d5a0;
      font-family: inherit;
      font-size: 1rem;
      letter-spacing: 0.1em;
      padding: 0.5rem 1.6rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .pull-btn:hover {
      background: #4a3f25;
      border-color: #9a8a50;
    }

    .pull-btn:active {
      background: #2a2010;
    }

    #results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .rune-card {
      background: #211c14;
      border: 1px solid #3a3220;
      border-radius: 6px;
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      animation: fadeIn 0.35s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .rune-top {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .rune-glyph {
      font-size: 3.2rem;
      line-height: 1;
      color: #f0e0a0;
      min-width: 3rem;
      text-align: center;
      text-shadow: 0 0 12px rgba(200, 160, 60, 0.35);
    }

    .rune-meta {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .rune-name {
      font-size: 1.15rem;
      color: #e0cfa0;
      letter-spacing: 0.06em;
    }

    .rune-unicode {
      font-size: 0.75rem;
      color: #6a5f45;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.04em;
    }

    .rune-desc {
      font-size: 0.88rem;
      color: #a09070;
      font-style: italic;
      line-height: 1.6;
      border-top: 1px solid #2e2818;
      padding-top: 0.7rem;
    }

    .empty-state {
      text-align: center;
      color: #4a4030;
      font-size: 1rem;
      letter-spacing: 0.08em;
      padding: 3rem 0;
      grid-column: 1 / -1;
    }

    .separator {
      width: 60px;
      height: 1px;
      background: #3a3220;
      margin: 0 auto 2rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Rune Bag</h1>
    <p>Daily Rune Pull</p>
  </header>

  <div class="controls">
    <label for="count">Runes to draw:</label>
    <select id="count">
      <option value="1" selected>1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6">6</option>
      <option value="7">7</option>
      <option value="8">8</option>
      <option value="9">9</option>
    </select>
    <button class="pull-btn" onclick="pull()">Pull</button>
  </div>

  <div class="separator"></div>

  <div id="results">
    <div class="empty-state">Draw the runes</div>
  </div>

  <script>
    // Fill in the desc fields below — they display on each rune card
    const FUTHORC = [
      { name: "Fehu",     unicode: "U+16A0", glyph: "ᚠ", desc: "" },
      { name: "Uruz",     unicode: "U+16A2", glyph: "ᚢ", desc: "" },
      { name: "Yr",       unicode: "U+16A3", glyph: "ᚣ", desc: "" },
      { name: "Thurisaz", unicode: "U+16A6", glyph: "ᚦ", desc: "" },
      { name: "Os",       unicode: "U+16A9", glyph: "ᚩ", desc: "" },
      { name: "Ac",       unicode: "U+16AA", glyph: "ᚪ", desc: "" },
      { name: "Ansuz",    unicode: "U+16AB", glyph: "ᚫ", desc: "" },
      { name: "Raidho",   unicode: "U+16B1", glyph: "ᚱ", desc: "" },
      { name: "Kenaz",    unicode: "U+16B2", glyph: "ᚲ", desc: "" },
      { name: "Gebo",     unicode: "U+16B7", glyph: "ᚷ", desc: "" },
      { name: "Gar",      unicode: "U+16B8", glyph: "ᚸ", desc: "" },
      { name: "Wunjo",    unicode: "U+16B9", glyph: "ᚹ", desc: "" },
      { name: "Hagalaz",  unicode: "U+16BB", glyph: "ᚻ", desc: "" },
      { name: "Nauthiz",  unicode: "U+16BE", glyph: "ᚾ", desc: "" },
      { name: "Isa",      unicode: "U+16C1", glyph: "ᛁ", desc: "" },
      { name: "Jera",     unicode: "U+16C3", glyph: "ᛃ", desc: "" },
      { name: "Eihwaz",   unicode: "U+16C7", glyph: "ᛇ", desc: "" },
      { name: "Perthro",  unicode: "U+16C8", glyph: "ᛈ", desc: "" },
      { name: "Elhaz",    unicode: "U+16C9", glyph: "ᛉ", desc: "" },
      { name: "Sowilo",   unicode: "U+16CB", glyph: "ᛋ", desc: "" },
      { name: "Tiwaz",    unicode: "U+16CF", glyph: "ᛏ", desc: "" },
      { name: "Berkano",  unicode: "U+16D2", glyph: "ᛒ", desc: "" },
      { name: "Ehwaz",    unicode: "U+16D6", glyph: "ᛖ", desc: "" },
      { name: "Mannaz",   unicode: "U+16D7", glyph: "ᛗ", desc: "" },
      { name: "Laguz",    unicode: "U+16DA", glyph: "ᛚ", desc: "" },
      { name: "Ingwaz",   unicode: "U+16DD", glyph: "ᛝ", desc: "" },
      { name: "Dagaz",    unicode: "U+16DE", glyph: "ᛞ", desc: "" },
      { name: "Othala",   unicode: "U+16DF", glyph: "ᛟ", desc: "" },
      { name: "Ear",      unicode: "U+16E0", glyph: "ᛠ", desc: "" },
      { name: "Ior",      unicode: "U+16E1", glyph: "ᛡ", desc: "" },
      { name: "Cweorth",  unicode: "U+16E2", glyph: "ᛢ", desc: "" },
      { name: "Calc",     unicode: "U+16E3", glyph: "ᛣ", desc: "" },
      { name: "Stan",     unicode: "U+16E5", glyph: "ᛥ", desc: "" },
    ];

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function pull() {
      const count = parseInt(document.getElementById('count').value, 10);
      const drawn = shuffle(FUTHORC).slice(0, count);
      const container = document.getElementById('results');

      container.innerHTML = drawn.map(r => `
        <div class="rune-card">
          <div class="rune-top">
            <div class="rune-glyph">${r.glyph}</div>
            <div class="rune-meta">
              <div class="rune-name">${r.name}</div>
              <!-- ><div class="rune-unicode">${r.unicode}</div>-->
            </div>
          </div>
          ${r.desc ? `<div class="rune-desc">${r.desc}</div>` : ''}
        </div>
      `).join('');
    }
  </script>

</body>
</html>
